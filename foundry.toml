[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ["dependencies"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 2000
bytecode_hash = "none"
cbor_metadata = false
verbosity = 3
gas_reports = ["ERC721TL", "ERC1155TL", "TRACE", "ERC7160TL", "ERC7160TLEditions"]
fs_permissions = [{ access = "read-write", path = "./"}]
show_progress = true

[fuzz]
runs = 1024

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
shape_sepolia = "${SHAPE_SEPOLIA_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"
mainnet = "${ETH_RPC_URL}"
arbitrum = "${ARB_RPC_URL}"
base = "${BASE_RPC_URL}"
shape = "${SHAPE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_KEY}" }
arbitrum_sepolia = {  key = "${ETHERSCAN_KEY}" }
base_sepolia = {  key = "${ETHERSCAN_KEY}" }
mainnet = { key = "${ETHERSCAN_KEY}"}
arbitrum = { key = "${ETHERSCAN_KEY}" }
base = { key = "${ETHERSCAN_KEY}" }

[dependencies]
forge-std = "1.14.0"
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"